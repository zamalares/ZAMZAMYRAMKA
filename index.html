<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyfrowa Ramka na Zdjęcia</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    .hidden { display: none !important; }
    #frame-container { position: relative; max-width: 800px; height: 500px; margin: 20px auto; overflow: hidden; border-radius: 8px; }
    .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out; }
    .slide.active { opacity: 1; }
    .controls { margin: 20px 0; }
    .panel { max-width: 600px; margin: 30px auto; background: #222; padding: 20px; border-radius: 8px; text-align: left; }
    input[type="text"], input[type="password"] { width: 70%; padding: 8px; margin-right: 5px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; margin: 8px 0; background: #333; padding: 8px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>

  <!-- EKRAN LOGOWANIA -->
  <div id="login-screen">
    <h2>Podaj hasło</h2>
    <input type="password" id="password-input" placeholder="Hasło...">
    <button onclick="checkPassword()">Wejdź</button>
  </div>

  <!-- APLIKACJA -->
  <div id="app" class="hidden">
    <h1>Ramka ze zdjęciami</h1>
    
    <div class="controls">
      <label for="speed">Czas wyświetlania (sekundy): <span id="speed-val">4</span>s</label><br>
      <input type="range" id="speed" min="2" max="10" value="4" oninput="updateSpeed(this.value)">
    </div>

    <div id="frame-container">
      <img id="img1" class="slide active" src="" alt="Photo 1">
      <img id="img2" class="slide" src="" alt="Photo 2">
    </div>

    <!-- PANEL ZARZĄDZANIA -->
    <div class="panel">
      <h3>Zarządzaj zdjęciami</h3>
      <input type="text" id="new-url" placeholder="Wklej bezpośredni URL do zdjęcia...">
      <button onclick="addPhoto()">Dodaj</button>

      <h4>Lista zdjęć:</h4>
      <ul id="photo-list"></ul>
    </div>
  </div>

  <script>
    const SECRET_HASH = "1a1dc91c907325c69271ddf0c944bc72"; // Domyślne hasło: "pass" (zahashowane MD5 dla wygody przykładowej)
    let photos = JSON.parse(localStorage.getItem('my_photos')) || [];
    let currentIndex = 0;
    let intervalId = null;
    let displayTime = 4000;
    let activeSlide = 1;

    function checkPassword() {
      const pass = document.getElementById('password-input').value;
      // Prosta weryfikacja (można zmienić na prosty warunek tekstowy: pass === "twojeHaslo")
      if (pass === "dzieci123") { 
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        initFrame();
      } else {
        alert("Błędne hasło!");
      }
    }

    function initFrame() {
      renderList();
      if (photos.length > 0) {
        document.getElementById('img1').src = photos[0];
        startSlideshow();
      }
    }

    function startSlideshow() {
      if (intervalId) clearInterval(intervalId);
      if (photos.length <= 1) return;

      intervalId = setInterval(() => {
        currentIndex = (currentIndex + 1) % photos.length;
        const nextImg = activeSlide === 1 ? document.getElementById('img2') : document.getElementById('img1');
        const currentImg = activeSlide === 1 ? document.getElementById('img1') : document.getElementById('img2');

        nextImg.src = photos[currentIndex];
        nextImg.classList.add('active');
        currentImg.classList.remove('active');

        activeSlide = activeSlide === 1 ? 2 : 1;
      }, displayTime);
    }

    function updateSpeed(val) {
      document.getElementById('speed-val').innerText = val;
      displayTime = val * 1000;
      startSlideshow();
    }

    function addPhoto() {
      let url = document.getElementById('new-url').value.trim();
      if (!url) return;

      // Konwersja linku Dropbox na bezpośredni link do obrazka
      if (url.includes('dropbox.com')) {
        url = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
      }

      photos.push(url);
      localStorage.setItem('my_photos', JSON.stringify(photos));
      document.getElementById('new-url').value = '';
      renderList();
      if (photos.length === 1) initFrame();
    }

    function removePhoto(index) {
      photos.splice(index, 1);
      localStorage.setItem('my_photos', JSON.stringify(photos));
      renderList();
      if (photos.length === 0) {
        clearInterval(intervalId);
        document.getElementById('img1').src = '';
        document.getElementById('img2').src = '';
      }
    }

    function renderList() {
      const list = document.getElementById('photo-list');
      list.innerHTML = '';
      photos.forEach((url, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${url.substring(0, 40)}...</span> <button onclick="removePhoto(${i})">Usuń</button>`;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
